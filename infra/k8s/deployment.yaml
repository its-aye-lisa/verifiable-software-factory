# Platform One / Big Bang-Aligned Hardened Kubernetes Deployment (DoD IL4 / FedRAMP Moderate)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-tictactoe
  namespace: aegis-mission
  labels:
    app.kubernetes.io/name: aegis-tictactoe
    app.kubernetes.io/part-of: aegis-software-factory
    gov.aegis.compliance/impact-level: "IL4"
    gov.aegis.compliance/fedramp: "moderate"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis-tictactoe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis-tictactoe
      annotations:
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aegis-tictactoe
          # Pin to immutable digest in production via GitOps / Kyverno enforcement
          image: ghcr.io/OWNER/aegis-tictactoe:v1.0.0
          imagePullPolicy: Always
          env:
            - name: GODEBUG
              value: "fips140=on"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-tictactoe
  namespace: aegis-mission
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aegis-tictactoe
  ports:
    - name: http
      port: 8080
      targetPort: http
