# =============================================================================
# Intent-Driven & Spec-Driven Development Pipeline (GitHub Issues -> Spec PR)
# =============================================================================
# Enables users to drive application evolution exclusively through GitHub
# Issues & Project Boards:
#   1. User opens an Intent & Spec Change Issue via structured Issue Form.
#   2. Approver applies label `intent-approved` (or moves card on Project Board).
#   3. Pipeline validates spec invariants, scaffolds a tracked spec branch/PR
#      referencing the Issue, and invokes the Verifiable Software Factory gates!
# =============================================================================
name: Intent-to-Spec Pipeline (Spec-Driven Development)

on:
  issues:
    types: [ opened, labeled ]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate-intent-and-create-spec-pr:
    name: Validate Structured Intent & Prepare Spec-Driven Change
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'intent-spec')
    steps:
      - uses: actions/checkout@v4

      - name: Validate Structured Intent Completeness (SSDF PW.1 / Requirements Traceability)
        id: validate
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const requiredSections = ['### Intent Summary', '### Formal Invariants', '### Acceptance Test Vectors'];
            const missing = requiredSections.filter(s => !body.includes(s));
            if (missing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ **Spec-Driven Gate:** Missing required intent sections: ${missing.join(', ')}. Please use the **Intent & Spec Change** issue template.`
              });
              core.setFailed('Incomplete structured intent');
              return;
            }
            const approved = (context.payload.issue.labels || []).some(l => l.name === 'intent-approved');
            core.setOutput('approved', approved ? 'true' : 'false');
            if (!approved) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: [
                  '✅ **Intent Schema Validated** (`spec/app.spec.json` traceability ready).',
                  '',
                  'Add the `intent-approved` label (or move to **Approved** on the Project Board) to automatically open a Spec-Driven branch & PR and trigger the Aegis Verifiable Software Factory.'
                ].join('\n')
              });
            }

      - name: Scaffold Spec-Driven Change Branch & Draft PR
        if: steps.validate.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          BRANCH="spec/intent-${ISSUE_NUM}"
          git config user.name "aegis-intent-bot[bot]"
          git config user.email "aegis-intent-bot[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          mkdir -p spec/intents
          cat <<EOF > "spec/intents/ISSUE-${ISSUE_NUM}.md"
          # Intent Record: #${ISSUE_NUM} — ${ISSUE_TITLE}
          - Tracked Issue: #${ISSUE_NUM}
          - Governance: Update \`spec/app.spec.json\` and \`cleanroom/c-verifier/\` before updating \`app/\`.
          - Run \`/dev-cycle\` in Antigravity IDE to implement and prove 3-way Go/GCC/Clang equivalence.
          EOF
          git add "spec/intents/ISSUE-${ISSUE_NUM}.md"
          git commit -m "spec(#${ISSUE_NUM}): record approved intent for ${ISSUE_TITLE}"
          git push -u origin "${BRANCH}"
          gh pr create \
            --draft \
            --title "spec(#${ISSUE_NUM}): ${ISSUE_TITLE}" \
            --body "Closes #${ISSUE_NUM}\n\nAuto-generated by the Intent-to-Spec Pipeline. Next: update \`spec/app.spec.json\`, run \`/dev-cycle\` in Antigravity IDE, and pass 2PI + Clean-Room + FedRAMP/IL4 CI gates."
