# =============================================================================
# Autonomous Defense & FedRAMP ConMon / DoD cATO Continuous Assurance
# =============================================================================
# Aligns autonomous defense with autonomous attack:
#   1. Daily reachability-aware SCA (govulncheck) + Trivy CVE drift detection
#   2. Continuous 6-scenario Untrusted Developer Red-Team Attack Simulations
#   3. Weekly OpenSSF Scorecard supply-chain posture audit
#   4. Automated POA&M Remediation GitHub Issue creation on ANY control failure
#      or SLA-violating CVE (FedRAMP 20x VDR / BOD 26-04: Crit 15d / High 30d)
# =============================================================================
name: Autonomous Defense & FedRAMP ConMon (cATO / BOD 26-04)

on:
  schedule:
    # Daily at 06:00 UTC — continuous vulnerability & red-team verification
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: write
  id-token: write

jobs:
  continuous-defense-and-redteam:
    name: Daily Autonomous Defense — SCA Drift & Red-Team Control Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Decoupled Reference Target App (new-vision-gaming)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/new-vision-gaming
          path: _target-app
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true

      - name: Reachability-Aware Vulnerability Scan (govulncheck)
        id: vuln
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -show verbose ./...

      - name: Run 6 Untrusted Developer Red-Team Attack Simulations (Regression Proof)
        id: redteam
        continue-on-error: true
        run: make factory TARGET=_target-app && make simulate-attacks TARGET=_target-app

      - name: Open Autonomous POA&M Issue if Drift or Control Regression Detected
        if: steps.vuln.outcome == 'failure' || steps.redteam.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[POA&M][Autonomous Defense] ConMon Control or CVE Drift Detected (${new Date().toISOString().slice(0,10)})`;
            const body = [
              '## Autonomous Defense Alert (FedRAMP ConMon / DoD cATO)',
              '',
              `- **govulncheck (SCA Reachability):** \`${'${{ steps.vuln.outcome }}'}\``,
              `- **Red-Team 6-Attack Control Verification:** \`${'${{ steps.redteam.outcome }}'}\``,
              `- **Workflow Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '### Required SLA Action (BOD 26-04 / FedRAMP 20x VDR)',
              '- Critical / KEV: Remediate within **15 days**',
              '- High: Remediate within **30 days**',
              '- Run `/conmon-upkeep` in Antigravity IDE to triage, update OpenVEX, or patch.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security-poam', 'autonomous-defense', 'priority-high']
            });

      - name: Fail Job if Autonomous Defense Detected Drift
        if: steps.vuln.outcome == 'failure' || steps.redteam.outcome == 'failure'
        run: exit 1

  openssf-scorecard:
    name: OpenSSF Scorecard Supply-Chain Posture Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.6.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard-results.sarif
          category: openssf-scorecard
